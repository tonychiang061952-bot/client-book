<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Drive 圖片顯示測試</title>
<style>body{margin:0;padding:16px;font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f5f6f8;color:#151c2c}section{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0;max-width:640px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 6px}img,iframe{display:block;width:100%;border-radius:6px;border:0}iframe{height:260px}.r{font-size:14px;margin-top:6px;font-weight:600}.ok{color:#2e7558}.bad{color:#a93e37}</style></head><body>
<h1>Drive 圖片顯示測試</h1><p>暫時的測試頁，只放一張沒有客戶資料的測試圖。每種方式看得到圖就算成功。</p>
<section><h2>方式 B：thumbnail 網址</h2><img id="b" alt="方式 B 測試圖" referrerpolicy="no-referrer"><div class="r" id="rb">載入中…</div></section>
<section><h2>方式 C：lh3 網址</h2><img id="c" alt="方式 C 測試圖" referrerpolicy="no-referrer"><div class="r" id="rc">載入中…</div></section>
<section><h2>方式 A：uc 檢視網址</h2><img id="a" alt="方式 A 測試圖" referrerpolicy="no-referrer"><div class="r" id="ra">載入中…</div></section>
<section><h2>方式 D：Drive 預覽框</h2><iframe title="Drive 預覽框" src="https://drive.google.com/file/d/1FsLJ5jcFrW094pIq7iLKmZuWCkrNII4i/preview"></iframe></section>
<script>const U={a:"https://drive.google.com/uc?export=view&id=1FsLJ5jcFrW094pIq7iLKmZuWCkrNII4i",b:"https://drive.google.com/thumbnail?id=1FsLJ5jcFrW094pIq7iLKmZuWCkrNII4i&sz=w1600",c:"https://lh3.googleusercontent.com/d/1FsLJ5jcFrW094pIq7iLKmZuWCkrNII4i=w1600"};for(const k in U){const t=performance.now(),m=document.getElementById(k),r=document.getElementById("r"+k);m.onload=()=>{r.textContent="成功，載入 "+Math.round(performance.now()-t)+" 毫秒";r.className="r ok"};m.onerror=()=>{r.textContent="失敗，顯示不出來";r.className="r bad"};m.src=U[k]}</script></body></html>
